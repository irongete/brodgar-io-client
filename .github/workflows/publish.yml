# A push to master publishes the next beta; the Run workflow button the next release. Both run publish.ps1.
name: Publish
# The run's title, fixed when the run is created: beta on a push, release from the button, the number when one
# is given. The version itself is counted inside the run, so it is in the step summary, never here.
run-name: brodgar-io-client-${{ github.event_name == 'push' && 'beta' || (inputs.version && format('v{0}', inputs.version) || 'release') }}

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "That number instead of the counted one"
        required: false
        type: string

permissions:
  contents: write
  actions: write   # to dispatch the Pages workflow after a release

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # a push skips a commit that carries a tag, published by hand; the button skips only a release's tag,
      # since HEAD is usually the beta its own push published, and a release makes that beta's code official
      - name: Skip a commit published by hand
        id: tagged
        env:
          EVENT: ${{ github.event_name }}
        run: |
          tags="$(git tag --points-at HEAD 'v*')"
          if [ "$EVENT" != 'push' ]; then tags="$(printf '%s\n' "$tags" | grep -v -- '-beta$' || true)"; fi
          if [ -n "$tags" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HEAD is already $tags: published by hand, nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-java@v6
        if: steps.tagged.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '23'

      - name: Checkers
        if: steps.tagged.outputs.skip != 'true'
        run: |
          python3 tools/docverbs.py
          python3 tools/refusalverbs.py
          python3 tools/widgetstate.py

      # the build takes the addons etc/release-addons names, each with the addons its manifest names in
      # "dependencies", from ../brodgar-io-client-addons, where build.xml's addons.repo looks: a public repository,
      # cloned there. Every one of them must be a folder of it, since ant's copy skips a missing one in silence
      - name: The addons a release ships
        if: steps.tagged.outputs.skip != 'true'
        run: |
          ids="$(grep -v '^[[:space:]]*#' etc/release-addons | tr -d '[:blank:]\r' | grep . || true)"
          if [ -z "$ids" ]; then exit 0; fi
          repo=../brodgar-io-client-addons
          git clone --quiet --depth 1 https://github.com/irongete/brodgar-io-client-addons.git "$repo"
          for id in $ids; do
            if [ ! -f "$repo/$id/manifest.json" ]; then
              echo "etc/release-addons names $id, which brodgar-io-client-addons does not hold" >&2
              exit 1
            fi
            deps="$(jq -r '(.dependencies // [])[] | sub(">=.*"; "")' "$repo/$id/manifest.json")"
            for dep in $deps; do
              if [ ! -f "$repo/$dep/manifest.json" ]; then
                echo "$id names $dep in its dependencies, which brodgar-io-client-addons does not hold" >&2
                exit 1
              fi
            done
          done

      # publish.ps1 hands back the tag it published (the step output `tag`) and writes the step summary
      - name: Publish
        id: publish
        if: steps.tagged.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $arguments = @{ Yes = $true }
          if ($env:EVENT -eq 'push') { $arguments.Beta = $true } else { $arguments.Release = $true }
          if ($env:VERSION) { $arguments.Version = $env:VERSION }
          ./publish.ps1 @arguments

      # a release event raised with this token starts no workflow, so the Pages one is dispatched by name;
      # a beta leaves the site alone
      - name: Publish the docs of the release
        if: steps.publish.outputs.tag != '' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: gh workflow run pages.yml --ref master -f "tag=$TAG"
